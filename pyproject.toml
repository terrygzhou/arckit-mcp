[project]
name = "arckit-mcp"
version = "0.1.0"
description = "ArcKit MCP server - exposes the ArcKit architecture-governance harness as MCP tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
]
authors = [{ name = "terrygzhou" }]
readme = "README.md"
license = "MIT"
keywords = [
    "architecture",
    "enterprise",
    "governance",
    "mcp",
    "model-context-protocol",
]

[project.optional-dependencies]
dev = [
    "arckit",
    "pytest",
]

[project.scripts]
arckit-mcp = "arckit_mcp.server:main"
arckit-mcp-sync = "arckit_mcp.sync:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "arckit_mcp",
    "arckit_mcp.frameworks",
    "arckit_mcp.skill",
    "arckit_mcp.skill.references",
]

[tool.setuptools.package-data]
arckit_mcp = [
    "*.py",
    "frameworks/*.py",
    "frameworks/SCHEMAS.json",
    "skill/SKILL.md",
    "skill/references/*.md",
]
